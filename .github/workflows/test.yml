name: Testar aplicação

on:
  push:
    branches:
      - main

jobs:

  teste:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Verificar Docker
        run: docker --version

      - name: Construir imagem
        run: docker build -t meu-site .

      - name: Executar container
        run: |
          docker run -d \
            --name meu-site \
            -p 8080:80 \
            meu-site

      - name: Testar Nginx
        run: curl http://localhost:8080

      - name: Parar container
        run: docker stop meu-site
